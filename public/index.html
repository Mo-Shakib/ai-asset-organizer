<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asset Organizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: var(--bg-color);
            color: var(--text-main);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            background-color: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #2563eb; }
        #statusMessage { margin-top: 1rem; font-size: 0.85rem; text-align: center; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Save AI Asset</h1>
        <p>Log your generated images and prompts to the database.</p>

        <form id="assetForm">
            <div class="form-group">
                <label for="imagePath">Image URL / Path</label>
                <input type="text" id="imagePath" placeholder="e.g., /uploads/my-image.png" required>
            </div>
            
            <div class="form-group">
                <label for="promptText">Positive Prompt</label>
                <textarea id="promptText" rows="3" placeholder="Cinematic lighting, hyper-realistic..." required></textarea>
            </div>

            <div class="form-group">
                <label for="negativePrompt">Negative Prompt</label>
                <textarea id="negativePrompt" rows="2" placeholder="blurry, low quality..."></textarea>
            </div>

            <div class="form-group">
                <label for="aiModel">AI Model Used</label>
                <select id="aiModel">
                    <option value="Midjourney v6">Midjourney v6</option>
                    <option value="DALL-E 3">DALL-E 3</option>
                    <option value="Stable Diffusion XL">Stable Diffusion XL</option>
                    <option value="Nano Banana 2">Nano Banana 2</option>
                </select>
            </div>

            <button type="submit">Save to Database</button>
            <div id="statusMessage"></div>
        </form>
    </div>

    <script>
        document.getElementById('assetForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent the page from reloading
            
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = 'Saving...';
            statusDiv.className = '';

            // Gather data from the form
            const payload = {
                imagePath: document.getElementById('imagePath').value,
                promptText: document.getElementById('promptText').value,
                negativePrompt: document.getElementById('negativePrompt').value,
                aiModel: document.getElementById('aiModel').value
            };

            try {
                // Send the POST request to our API
                const response = await fetch('/api/assets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.textContent = 'Asset saved successfully! ID: ' + result.data.id;
                    statusDiv.className = 'success';
                    document.getElementById('assetForm').reset(); // Clear the form
                } else {
                    throw new Error(result.message || 'Failed to save');
                }
            } catch (error) {
                statusDiv.textContent = 'Error: ' + error.message;
                statusDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
